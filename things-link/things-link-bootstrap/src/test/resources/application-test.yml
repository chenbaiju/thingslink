# bootstrap 模块集成测试的配置**追加**。
#
# 【为什么是 application-test.yml 而不是 application.yml】
# test/resources 下的 application.yml 会**整体覆盖** main/resources 下的同名文件，
# 而不是与之合并 —— 踩过一次：只想加一个迁移目录，结果 ddl-auto、flyway.user 等
# 全部丢失，症状是「配置项莫名变成 null」。
#
# profile 专属文件（application-{profile}.yml）才是追加语义：它叠加在
# application.yml 之上。profile 由 AbstractIntegrationTest 的 @ActiveProfiles 激活。

spring:
  kafka:
    admin:
      # 普通 bootstrap 集成测试只验证数据库、HTTP 与 Bean 装配，不应依赖开发机恰好运行
      # localhost:19092。需要消息链路的 EmqxCallbackTests 会显式恢复真实 Kafka。
      auto-create: false
    listener:
      # 禁止非消息测试在 ApplicationContext 启动阶段连接默认 broker；否则 CI 没有本地
      # Redpanda 时会卡在重连循环，并用 Kafka 4.x 的重试日志迅速耗尽 Actions 日志额度。
      auto-startup: false
  flyway:
    locations:
      - classpath:db/migration/support
      - classpath:db/migration/project
      - classpath:db/migration/issuer
      - classpath:db/migration/device
      - classpath:db/migration/telemetry
      # S6 告警域迁移也必须进入 Testcontainers 空库，否则生产迁移遗漏会被测试掩盖。
      - classpath:db/migration/alarm
      # S7 任务域迁移必须参加真实 PostgreSQL 的 RLS、约束与租约验收。
      - classpath:db/migration/task
      # S8 规则域迁移必须参加真实 PostgreSQL 的版本唯一性、RLS 与不可变性验收。
      - classpath:db/migration/rule
      - classpath:db/migration/iam
      # S11 终端用户域迁移必须参加真实 PostgreSQL 的 RLS、复合外键与隔离验收。
      - classpath:db/migration/enduser
      # S12 项目导出任务必须参加真实 PostgreSQL 的状态、租约、RLS 与约束验收。
      - classpath:db/migration/export
      # X-02登记看板域位置；即使首个迁移尚未创建，测试清单也必须与生产保持一致。
      - classpath:db/migration/dashboard
      # X-02登记OTA域位置；S13-1加入首个迁移后会自动进入Testcontainers空库验收。
      - classpath:db/migration/ota
      - classpath:db/migration/integration
      # 测试专用：hypertable 探针表。不在生产迁移路径里
      - classpath:db/migration-test

things-link:
  automation:
    retention:
      # 历史夹具由专项显式清理，缓存上下文不能抢删其他测试的老事实。
      enabled: false
  enduser:
    token-cleanup:
      # 时间回拨和链清理由专项测试显式驱动，避免跨上下文维护线程竞争。
      enabled: false
  commercial:
    subscription-lifecycle:
      # S14-6a（关闭 D-169）：生产默认开启（matchIfMissing=true），但 bootstrap 集成测试共享同一个
      # PostgreSQL 容器，后台推进线程会与用例显式推进的时间轴竞争（用例故意把服务期放在过去验证到期），
      # 因此在测试 profile 显式关闭；需要验证默认路径的用例用 @TestPropertySource 显式开启。
      enabled: false
  project:
    cleanup:
      # ADR0092：普通测试不能继承宿主清理开关抢占共享夹具；专门装配测试显式覆盖为true。
      enabled: false
  storage:
    # 普通上下文只装配客户端而不联网；5g1真实MinIO测试会覆盖endpoint并使用同一测试凭据。
    internal-endpoint: http://127.0.0.1:19000
    external-endpoint: http://127.0.0.1:19000
    access-key: export-test-access
    secret-key: export-test-secret-2026
  datasource:
    # Spring 会按测试类差异缓存多个 ApplicationContext；若每个上下文都预热生产的 6+10 条连接，
    # 共享 PostgreSQL 容器会先于业务断言耗尽 max_connections。普通集成测试只需验证真实 JDBC/RLS，
    # 因此按需创建且每池最多 2 条；双池容量与互不饥饿由 DualDataSourceIsolationTests 显式恢复生产规格验收。
    control:
      maximum-pool-size: 2
      minimum-idle: 0
    data:
      maximum-pool-size: 2
      minimum-idle: 0
  scheduling:
    # 普通集成测试没有在途生产任务；立即关闭后台触发器，避免固定延迟任务拖住测试 JVM。
    shutdown-await-seconds: 0
  ota:
    download-authorization:
      # 专项显式驱动授权，避免缓存上下文领取其他测试的请求。
      enabled: false
    notification:
      # 专项显式驱动真实交付，避免共享context抢占待断言租约。
      enabled: false
    install-stop:
      # 安全取消专项显式驱动，缓存上下文不得抢占停止能力。
      enabled: false
    campaign-advancement:
      # 批次专项显式驱动推进，不让缓存上下文扩大其他测试活动。
      enabled: false
    campaign:
      # 缓存上下文不能领取其他测试活动；专项显式调用真实准入事务。
      runtime-enabled: false
    publication:
      # 多个缓存上下文不能后台领取其他测试的发布夹具；专项显式执行processor。
      enabled: false
    # 专项测试显式驱动持久期限服务，避免背景扫描抢占短租约。
    progress-timeout:
      enabled: false
    # 许可实际交付由专项显式驱动，避免后台抢占测试能力。
    commit-permit:
      enabled: false
    # 只读回退预检由专项显式驱动，避免自动候选领取抢占夹具。
    rollback-execution:
      enabled: false
    rollback-preflight:
      enabled: false
    commit-reconciliation:
      enabled: false
    upload:
      # 共享数据库中恢复由专项显式驱动，避免另一缓存context抢先领取待断言会话。
      # 生产默认仍开启；真实对象/租约/恢复边界由OTA生命周期专项覆盖。
      recovery-enabled: false
  telemetry:
    aggregate-backfill:
      # 专项集成测试显式驱动扫描；禁止共享数据库的后台任务抢先领取待断言窗口。
      initial-delay-millis: 3600000
  kafka:
    concurrency-guard:
      # 普通 Testcontainers 集成测试不启动 Kafka listener，也没有与生产一致的主题分区元数据；
      # 并发上界由专项守卫测试和真实 Kafka 验收覆盖，避免数据库测试把 broker 缺席误报成装配失败。
      enabled: false
  rule:
    debug-cleanup:
      # 集成测试显式调用清理函数验证保留语义，禁止后台线程抢先删除夹具。
      enabled: false
    sandbox:
      # 独立 Worker JVM 在低磁盘 I/O（如 C: 盘满）时冷启动可能超过默认 5s，导致 waitForReady 超时误判
      # SANDBOX_WORKER_STARTUP 并把规则推入 1m 重试；测试放宽启动墙钟以消除环境抖动，不改生产默认 5s。
      max-startup-time: 60s
  command:
    # 命令生命周期测试会显式调用受控领取函数；推迟后台扫描，避免它在断言前抢走刚回拨的到期命令。
    # Bean 仍会正常装配，生产调度配置与方法签名不会被测试专用条件 Bean 掩盖。
    timeout-scan-initial-delay-millis: 3600000
  access:
    http:
      # 设备面 HTTP 接入在测试里显式开启；测试客户端不建立 TLS，按冻结的测试专用开关放行回环明文。
      enabled: true
      allow-insecure-loopback: true
    budget:
      # 设备面 HTTP 套件全部来自同一个回环地址，按来源 IP 的 30/min 会让同类之间互相挤占；
      # 只放宽 IP 窗口，定向（每设备）窗口保持冻结值，预算用例仍然能在真实窗口上被拒。
      auth-per-minute-per-ip: 100000
  device:
    access-request-cleanup:
      # 接入幂等保留期由专项用例显式驱动删除，禁止后台线程在断言前清掉刚回拨的过期事实。
      enabled: false
  iam:
    token-cleanup:
      # 避免后台维护线程与共享 Testcontainers 夹具清理竞争；专项单测仍覆盖批量与保留窗口。
      enabled: false
  quota:
    # 通用 API 测试共享容器并直接清理项目夹具；REST 事实由专项真实 PG 用例验证，避免跨类残留阻断外键清理。
    daily-usage-recording-enabled: false
    daily-reconciliation:
      # 集成测试共享数据库且自行驱动归并；禁止后台线程在夹具清理之间写入跨用例账务事实。
      enabled: false
  notification:
    retry:
      # 普通 HTTP/数据库集成测试不启动跨项目调度；专用重试测试显式调用调度器。
      enabled: false
  outbox:
    publisher:
      # 默认集成测试不带 Kafka；命令链路测试会显式调用发布器或覆盖为 true，避免后台线程连接开发机 broker。
      enabled: false
  security:
    jwt:
      # 测试专用密钥。与开发默认值不同，避免测试「碰巧」依赖某个具体密钥值
      secret: test-only-secret-key-at-least-32-bytes-long
    app-jwt:
      # App 终端用户令牌的测试密钥。与控制台 jwt 测试密钥刻意不同，
      # 钉住「两类令牌互斥」这一安全边界不依赖巧合
      secret: test-only-app-secret-key-at-least-32-bytes-long
