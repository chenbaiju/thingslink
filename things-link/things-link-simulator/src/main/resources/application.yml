# 模拟器是独立工具进程，使用 8090 避免与主 API 的 8080 冲突。
server:
  # 控制面接收设备明文 Token，默认只能从本机访问；远程压测必须显式配置受保护的测试网地址。
  address: ${SIMULATOR_BIND_ADDRESS:127.0.0.1}
  port: ${SIMULATOR_PORT:8090}

spring:
  application:
    # 独立服务名让日志与后续 Prometheus 指标不会混入生产 API 序列。
    name: things-link-simulator

simulator:
  shard:
    # 单进程/单分片最大设备数（服务层软保护，可由 A4-0 结论下调）。
    # HTTP 层的 @Size(max=1000) 仍是硬上限；10,000 台由多进程/多节点分片完成。
    max-devices: 1000
  manifest:
    # PUBACK 成功集合按消息类型写入此目录；资格脚本后续会为每个 runId/shardId 注入独立绝对路径。
    dir: ${SIMULATOR_MANIFEST_DIR:manifest}
  ota:
    # 设备侧 OTA 接线默认关闭：真实 OTA 需要受控签名器签出 READY 固件并派发真实授权，
    # 模拟器本地不产生授权链。关闭时不订阅任何 OTA Topic，也不写任何 OTA 目录。
    enabled: ${SIMULATOR_OTA_ENABLED:false}
    # 每设备 OTA 目录的基目录；设备目录为 <dir>/<deviceKey>，内含 staging.bin、ota.log 与 boot-id。
    dir: ${SIMULATOR_OTA_DIR:ota}
    # 是否允许模拟器上报 HEALTH_CHECKING（自检/看门狗健康）。默认 false：那是硬件事实，
    # 模拟器没有被显式告知时只上报 VERIFYING/INSTALLING/REBOOTING。
    assert-health: ${SIMULATOR_OTA_ASSERT_HEALTH:false}
    # 是否允许下载地址使用本机回环明文 HTTP。默认 false：生产 OTA 只接受 HTTPS 临时地址，
    # 仅本机受控联调（例如本地真实 HTTP artifact 服务器）才显式打开。
    allow-insecure-loopback: ${SIMULATOR_OTA_ALLOW_INSECURE_LOOPBACK:false}
